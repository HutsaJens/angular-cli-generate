name: CI and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Detect extension version change
        id: version
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const { appendFileSync, readFileSync } = require("node:fs");
            const before = process.env.BEFORE;
            const previous = /^0+$/.test(before)
              ? undefined
              : JSON.parse(execFileSync("git", ["show", `${before}:package.json`], { encoding: "utf8" })).version;
            const current = JSON.parse(readFileSync("package.json", "utf8")).version;
            appendFileSync(process.env.GITHUB_OUTPUT, `changed=${previous !== current}\n`);
          '

  release:
    needs: verify
    if: github.event_name == 'push' && needs.verify.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package -- --out extension.vsix
      - name: Extract release notes
        id: notes
        run: |
          node <<'NODE'
          const { appendFileSync, readFileSync, writeFileSync } = require("node:fs");
          const version = JSON.parse(readFileSync("package.json", "utf8")).version;
          const sections = readFileSync("CHANGELOG.md", "utf8").split(/^##\s+/m);
          const section = sections.find((entry) => entry.split(/\r?\n/, 1)[0].trim() === version);
          if (!section) throw new Error(`CHANGELOG.md has no section for version ${version}`);
          const notes = section.split(/\r?\n/).slice(1).join("\n").trim();
          if (!notes) throw new Error(`CHANGELOG.md section for ${version} is empty`);
          writeFileSync("release-notes.md", `${notes}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${version}\n`);
          NODE
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
        run: gh release create "$TAG" extension.vsix --title "$TAG" --notes-file release-notes.md
